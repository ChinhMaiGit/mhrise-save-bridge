[project]
name = "mhrise-save-bridge"
version = "0.1.0"
description = "Monster Hunter Rise: bring a Nintendo Switch save to the Steam (PC) version"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = ["pycryptodome>=3.20"]

[project.scripts]
mhrise-save-bridge = "mhrise_save_bridge.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pyinstaller>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mhrise_save_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
